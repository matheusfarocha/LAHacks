<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <title>Glass Car Dash</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #232323;
        color: #e5e5e5;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app {
        display: flex;
        flex-direction: column;
        gap: 14px;
        height: 100%;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      .phone-position-marker {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .55));
      }
      .phone-position-marker span {
        display: block;
        width: 0;
        height: 0;
        border-left: 9px solid transparent;
        border-right: 9px solid transparent;
        border-bottom: 24px solid #4edb68;
      }
      .maplibregl-map { font: 12px/20px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      .maplibregl-ctrl-attrib { color: #222; }
    </style>
  </head>
  <body>
    <div id="app">Loading speed…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
